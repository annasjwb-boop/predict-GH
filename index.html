const WATER_TIMELINE = (() => {
  const data = [];
  for (let d = -120; d <= 0; d++) {
    let res, fe, dp;
    if (d <= -70) {
      res = 16 + Math.sin(d * 0.3) * 0.3 + (Math.random() - 0.5) * 0.4;
      fe = 3 + Math.random() * 2;
      dp = 0.3 + Math.max(0, (d + 120) / 50) * 0.1;
    } else {
      const t = (d + 70) / 70;
      res = Math.max(0.3, 16 * Math.exp(-3.2 * t) + (Math.random() - 0.5) * 0.3);
      fe = Math.min(95, 5 + 80 * (t * t) + Math.sin(d * 0.5) * 6 + (Math.random() - 0.5) * 8);
      dp = Math.min(1.65, 0.4 + 1.2 * t + (Math.random() - 0.5) * 0.05);
    }
    data.push({
      day: d,
      resistivity: +res.toFixed(2),
      iron: +Math.max(0, fe).toFixed(1),
      dpA: +dp.toFixed(2),
      dpB: +(dp - 0.06).toFixed(2),
      fleetHealth: d <= -70 ? 85 + (Math.random() - 0.5) * 1.5 : Math.max(58, 85 - (d + 70) / 70 * 28 + (Math.random() - 0.5) * 1.2)
    });
  }
  return data;
})();

})();
